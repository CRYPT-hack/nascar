<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Interlagos</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eef8;
        --dim: #93a3bb;
        --panel: rgba(10, 14, 22, 0.88);
        --line: rgba(120, 160, 220, 0.24);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0f18; color: var(--ink); }
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: 24px; text-align: center; color: var(--dim); white-space: pre-wrap;
        pointer-events: none;
      }

      /* UI styling now lives in client/src/hud/hud.css, imported by the
         modules that use it. What remains here is page-level only: the
         document background, the canvas, and the boot message that shows
         before any module has loaded. */
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot">loading…</div>
    <script type="module" src="/client/src/main.ts"></script>
  </body>
</html>
